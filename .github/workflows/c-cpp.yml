name: Build Handheld Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsdl1.2-dev libsdl-image1.2-dev libsdl-ttf2.0-dev libsdl-gfx1.2-dev libboost-locale-dev

    - name: Compile Application
      run: |
        make clean
        make

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: simplermenu_plus_build
        path: output/
