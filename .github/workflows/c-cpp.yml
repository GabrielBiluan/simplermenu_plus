name: Build Handheld Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM Toolchain Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf wget

    - name: Manual Extraction of ARM Dependencies
      run: |
        mkdir -p sysroot
        cd sysroot
        
        # Download and extract the matching armhf architecture binaries from Ubuntu Ports
        wget http://ubuntu.com || wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        wget http://ubuntu.com || true
        
        # Extract files cleanly out of the package structures
        for f in *.deb; do dpkg-deb -x "$f" . ; done
        cd ..

    - name: Compile Application for RG35XX (ARM)
      run: |
        make clean
        # Point the compiler explicitly to look inside our custom sysroot directory for the ARM library targets
        make CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ \
             CFLAGS="-I$GITHUB_WORKSPACE/sysroot/usr/include" \
             CXXFLAGS="-I$GITHUB_WORKSPACE/sysroot/usr/include" \
             LDFLAGS="-L$GITHUB_WORKSPACE/sysroot/usr/lib/arm-linux-gnueabihf"

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: simplermenu_plus_RG35XX
        path: output/
