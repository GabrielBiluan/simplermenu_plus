name: Build Handheld Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Multi-arch and Map ARM Ports Repository
      run: |
        sudo dpkg --add-architecture armhf
        
        # Configure sources so that standard repos only look for amd64, and ports looks for armhf
        sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list.d/ubuntu.sources || true
        sudo sed -i 's/deb https/deb [arch=amd64] https/g' /etc/apt/sources.list.d/ubuntu.sources || true
        
        echo "Types: deb
        URIs: http://ubuntu.com
        Suites: noble noble-updates noble-security noble-backports
        Components: main universe restricted multiverse
        Architectures: armhf" | sudo tee /etc/apt/sources.list.d/armhf.sources

    - name: Install ARM Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        sudo apt-get install -y libsdl1.2-dev:armhf libsdl-image1.2-dev:armhf libsdl-ttf2.0-dev:armhf libsdl-gfx1.2-dev:armhf libboost-locale-dev:armhf libboost-filesystem-dev:armhf rapidjson-dev

    - name: Compile Application for RG35XX (ARM)
      run: |
        make clean
        make CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: simplermenu_plus_RG35XX
        path: output/
